name: E2E and feature matrix

# docs/testing/FEATURES.md. The e2e job runs every non-live row in real Chromium, Firefox and
# WebKit against the built site (about 5 minutes). The @live rows run in the nightly box run
# (~/repos/testing/nightly-adityaaswani.com.sh), not here.
on:
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Feature matrix rows
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, gcp]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Every changed feature has a new or updated FEATURES.md row
        run: node scripts/check-feature-matrix.mjs "origin/${{ github.base_ref }}"

  e2e:
    name: E2E (Chromium, Firefox, WebKit)
    runs-on: [self-hosted, linux, gcp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Install browser system libraries
        run: npx playwright install-deps chromium firefox webkit
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
