name: E2E and feature matrix

# docs/testing/FEATURES.md. The e2e job runs every non-live row in real Chromium, Firefox and
# WebKit against the built site (one job per engine). The @live rows run in the nightly box run
# (~/repos/testing/nightly-adityaaswani.com.sh), not here.
on:
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Feature matrix rows
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, gcp]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # The self-hosted runner keeps old 22.x builds in its tool cache; "22" alone resolved to 22.23.3,
          # below astro 7.4.2's engines (>=22.23.4, dependabot #37). Always take the newest 22.x.
          check-latest: true
      - name: Every changed feature has a new or updated FEATURES.md row
        run: node scripts/check-feature-matrix.mjs "origin/${{ github.base_ref }}"

  e2e:
    # AA-S16: on the self-hosted gcp runner the whole suite (845 tests) never finished inside 15 min,
    # so every run since #40 was cancelled. One job per engine, and WebKit split by device, keeps each
    # well under its cap. The runner VM (ci-runner-1, e2-standard-4) also runs other repos' runners, so
    # these jobs share 4 vCPUs with whatever else is running; playwright.config.mjs uses 2 workers on CI.
    name: E2E (${{ matrix.name }})
    runs-on: [self-hosted, linux, gcp]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium, engine: chromium, projects: '*-chromium' }
          - { name: firefox, engine: firefox, projects: desktop-firefox }
          - { name: desktop-webkit, engine: webkit, projects: desktop-webkit }
          - { name: phone-webkit, engine: webkit, projects: phone-webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # The self-hosted runner keeps old 22.x builds in its tool cache; "22" alone resolved to 22.23.3,
          # below astro 7.4.2's engines (>=22.23.4, dependabot #37). Always take the newest 22.x.
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.engine }}-${{ hashFiles('package-lock.json') }}
      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.engine }}
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Install browser system libraries
        run: npx playwright install-deps ${{ matrix.engine }}
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run build
      # The first launch of a browser on the runner is slow (three cold Firefox launches at once took
      # 10-17 s each and their tests timed out); pay it here, outside any test's 30 s budget. The load
      # line shows how busy the shared VM was when the tests started.
      - name: Warm up ${{ matrix.engine }}
        run: |
          nproc; uptime
          node -e "require('@playwright/test').${{ matrix.engine }}.launch().then(async (b) => { await (await b.newPage()).goto('about:blank'); await b.close(); })"
      - run: npm run test:e2e -- --project="${{ matrix.projects }}"
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-traces-${{ matrix.name }}
          path: test-results/
          retention-days: 7
