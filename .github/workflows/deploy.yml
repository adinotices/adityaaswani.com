name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Build (and test) every PR to main; only pushes to main deploy.
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Weekly rebuild so new essays from the Substack feed appear without a commit.
  schedule:
    - cron: '0 9 * * 1'

# Sets permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time
concurrency:
  # PR builds get their own group so they never queue behind (or hold up) a deploy.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Unit tests
        run: npm test
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build with Astro
        run: |
          npm run build
        working-directory: ${{ env.BUILD_PATH }}

      - name: Check the built site (links, og:image, sitemap, CSP hashes)
        run: npm run test:dist
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.BUILD_PATH }}/dist
          # v4+ leaves dotfiles out by default, which would drop /.well-known/security.txt.
          include-hidden-files: true

      # The upload action leaves its tarball in RUNNER_TEMP; fail before deploying if it lacks security.txt.
      - name: Check the artifact includes .well-known/security.txt
        run: |
          tar -tf "$RUNNER_TEMP/artifact.tar" > "$RUNNER_TEMP/artifact-files.txt"
          echo "$(wc -l < "$RUNNER_TEMP/artifact-files.txt") entries in the Pages artifact"
          if ! grep -qx './.well-known/security.txt' "$RUNNER_TEMP/artifact-files.txt"; then
            echo "::error::.well-known/security.txt is missing from the Pages artifact (include-hidden-files?)"
            exit 1
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1